<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0d1015; }
    * { box-sizing: border-box; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    ::selection { background: rgba(74,222,128,0.25); }
    input::placeholder { color: var(--g-dim); }
    a { color: var(--g-bright); text-decoration: underline; text-underline-offset: 2px; }
    a:hover { color: var(--g); }
    @media (max-width: 760px) { .portrait { display: none !important; } }
  </style>
</helmet>
<div onClick="{{ focusInput }}" style="{{ rootStyle }}">
  <img class="portrait" src="assets/portrait.png" alt="Wesley Alves" style="position:fixed;top:clamp(1px,3vw,40px);right:clamp(40px,6vw,200px);width:clamp(120px,16vw,220px);height:auto;z-index:4;opacity:1;filter:brightness(1.05) contrast(1.05);pointer-events:none;">
  <sc-if value="{{ scanlines }}" hint-placeholder-val="{{ true }}">
    <div style="position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.22) 2px 3px);opacity:0.35;"></div>
  </sc-if>
  <div ref="{{ scrollRef }}" style="height:100%;overflow-y:auto;padding:clamp(16px,4vw,44px);">
    <div style="max-width:900px;margin:0 auto;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:clamp(12px,1.6vw,15px);line-height:1.65;">
      {{ output }}
      <sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:baseline;flex-wrap:wrap;">
          <span style="color:var(--g);white-space:pre;">visitor</span><span style="color:var(--g-dim);white-space:pre;">@wesley</span><span style="color:var(--g-dim);white-space:pre;">:~$ </span>
          <input ref="{{ inputRef }}" value="{{ input }}" onChange="{{ onInput }}" onKeyDown="{{ onKeyDown }}" spellcheck="false" autoComplete="off" autoCapitalize="off" autoCorrect="off" style="flex:1;min-width:80px;background:transparent;border:none;outline:none;color:var(--g-bright);caret-color:var(--g);font-family:inherit;font-size:inherit;line-height:inherit;padding:0;">
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;greenTone&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;soft&quot;, &quot;classic&quot;, &quot;amber&quot;], &quot;default&quot;: &quot;soft&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Look&quot; },
  &quot;glow&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Look&quot; },
  &quot;scanlines&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Look&quot; },
  &quot;defaultLang&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;auto&quot;, &quot;en&quot;, &quot;pt&quot;], &quot;default&quot;: &quot;auto&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Content&quot; }
}">
const BANNER = [
"██╗    ██╗███████╗███████╗██╗     ███████╗██╗   ██╗",
"██║    ██║██╔════╝██╔════╝██║     ██╔════╝╚██╗ ██╔╝",
"██║ █╗ ██║█████╗  ███████╗██║     █████╗   ╚████╔╝ ",
"██║███╗██║██╔══╝  ╚════██║██║     ██╔══╝    ╚██╔╝  ",
"╚███╔███╔╝███████╗███████║███████╗███████╗   ██║   ",
" ╚══╝╚══╝ ╚══════╝╚══════╝╚══════╝╚══════╝   ╚═╝   "
].join("\n");

const TONES = {
  soft:    { g:"#4ade80", dim:"rgba(74,222,128,0.55)", bright:"#86efac" },
  classic: { g:"#33ff33", dim:"rgba(51,255,51,0.5)",   bright:"#8dff8d" },
  amber:   { g:"#ffb000", dim:"rgba(255,176,0,0.5)",   bright:"#ffd27f" }
};

const CMDS = ["about","experience","skills","education","contact","projects","help","clear","en","pt"];

const T = {
  en: {
    welcomeSub: "Information Security Engineer · Portfolio",
    welcomeHint: "Type a command below, or `help` to see the list.",
    help: [
      ["about",       "Who I am"],
      ["experience",  "Where I've worked"],
      ["skills",      "What I work with"],
      ["education",   "Studies & certifications"],
      ["projects",    "Code & repositories"],
      ["contact",     "Get in touch"],
      ["en / pt",     "Switch language"],
      ["clear",       "Clear the screen"]
    ],
    about: [
      { h: "Wesley Alves" },
      { p: "Junior Security Engineer" },
      { p: "SOC · Azure · Monitoring · Risk · IAM" },
      { p: "Campinas, SP · Brazil" },
      { sp: 1 },
      { p: "Focused on defensive security, log analysis and automation." }
    ],
    experience: [
      { kv: ["Hunter Douglas, Inc.", "Dec 2024 – Present"] },
      { d: "IT Support — monitoring, log analysis & risk mitigation across cloud and corporate systems." },
      { sp: 1 },
      { kv: ["Instituto de Defesa Cibernética", "Jun 2026 – Present"] },
      { d: "Committee Member — SIEM-based incident analysis & countermeasures (remote)." },
      { sp: 1 },
      { kv: ["Rede de Distribuição Zeferino", "Feb – Dec 2024"] },
      { d: "IT Support — built an IAM / access-governance model, PowerShell automation, Shadow-IT control." },
      { sp: 1 },
      { kv: ["92FM São João", "Sep 2019 – Aug 2021"] },
      { d: "Web Dev Intern — app-layer security fixes, Git workflow, web portal maintenance." }
    ],
    skills: [
      { kv: ["Security", "Monitoring · log analysis · vuln mgmt · IAM · TPRM · pentest fundamentals"] },
      { kv: ["Cloud/Net", "Azure · Entra ID · Active Directory · TCP/IP · DNS · HTTP/S · Linux/Windows"] },
      { kv: ["Automation", "Python · PowerShell · SQL · Git · REST/JSON · OWASP Top 10"] }
    ],
    education: [
      { kv: ["MBA in Cybersecurity", "2026 - in progress"] },
      { d: "USP Esalq — University of São Paulo" },
      { sp: 1 },
      { kv: ["B.Tech Internet Systems", "2019 – 2023"] },
      { d: "Instituto Federal de São Paulo (IFSP)" },
      { sp: 1 },
      { h2: "Certifications" },
      { p: "Azure Administrator Associate (AZ-104)" },
      { p: "Azure Fundamentals (AZ-900)" }
    ],
    projects: [
      { p: "All code and repositories live on GitHub:" },
      { link: ["github.com/euwesleyalves", "https://github.com/euwesleyalves"] }
    ],
    contact: [
      { kv: ["email",    "waoliveira01@gmail.com"], href: "mailto:waoliveira01@gmail.com" },
      { kv: ["phone",    "(19) 97164-5572"] },
      { kv: ["linkedin", "linkedin.com/in/euwesleyalves"], href: "https://linkedin.com/in/euwesleyalves" },
      { kv: ["github",   "github.com/euwesleyalves"], href: "https://github.com/euwesleyalves" }
    ],
    langSet: "Language set to English.",
    notFound: (c) => "command not found: " + c + " — type `help`."
  },
  pt: {
    welcomeSub: "Analista de Segurança da Informação · Portfólio",
    welcomeHint: "Digite um comando abaixo, ou `help` para ver a lista.",
    help: [
      ["about",       "Quem eu sou"],
      ["experience",  "Onde trabalhei"],
      ["skills",      "Com o que trabalho"],
      ["education",   "Formação e certificações"],
      ["projects",    "Código e repositórios"],
      ["contact",     "Fale comigo"],
      ["en / pt",     "Trocar idioma"],
      ["clear",       "Limpar a tela"]
    ],
    about: [
      { h: "Wesley Alves" },
      { p: "Analista de Segurança da Informação Júnior" },
      { p: "SOC · Azure · Monitoramento · Risco · IAM" },
      { p: "Campinas, SP · Brasil" },
      { sp: 1 },
      { p: "Focado em segurança defensiva, análise de logs e automação." }
    ],
    experience: [
      { kv: ["Hunter Douglas, Inc.", "Dez 2024 – Atual"] },
      { d: "Suporte de TI — monitoramento, análise de logs e mitigação de riscos em ambientes de nuvem e corporativos." },
      { sp: 1 },
      { kv: ["Instituto de Defesa Cibernética", "Jun 2026 – Atual"] },
      { d: "Membro de comitê — análise de incidentes com SIEM e contramedidas (remoto)." },
      { sp: 1 },
      { kv: ["Rede de Distribuição Zeferino", "Fev – Dez 2024"] },
      { d: "Suporte de TI — modelo de governança de acessos (IAM), automação em PowerShell, controle de Shadow-IT." },
      { sp: 1 },
      { kv: ["92FM São João", "Set 2019 – Ago 2021"] },
      { d: "Estágio Web Dev — correções de segurança em aplicação, versionamento com Git, manutenção do portal." }
    ],
    skills: [
      { kv: ["Segurança", "Monitoramento · logs · gestão de vuln · IAM · TPRM · fundamentos de pentest"] },
      { kv: ["Cloud/Rede", "Azure · Entra ID · Active Directory · TCP/IP · DNS · HTTP/S · Linux/Windows"] },
      { kv: ["Automação", "Python · PowerShell · SQL · Git · REST/JSON · OWASP Top 10"] }
    ],
    education: [
      { kv: ["MBA em Cibersegurança", "2026 - em andamento"] },
      { d: "USP Esalq — Universidade de São Paulo" },
      { sp: 1 },
      { kv: ["Tecnólogo em Sistemas para Internet", "2019 – 2023"] },
      { d: "Instituto Federal de São Paulo (IFSP)" },
      { sp: 1 },
      { h2: "Certificações" },
      { p: "Azure Administrator Associate (AZ-104)" },
      { p: "Azure Fundamentals (AZ-900)" }
    ],
    projects: [
      { p: "Todo o código e repositórios estão no GitHub:" },
      { link: ["github.com/euwesleyalves", "https://github.com/euwesleyalves"] }
    ],
    contact: [
      { kv: ["email",    "waoliveira01@gmail.com"], href: "mailto:waoliveira01@gmail.com" },
      { kv: ["telefone", "(19) 97164-5572"] },
      { kv: ["linkedin", "linkedin.com/in/euwesleyalves"], href: "https://linkedin.com/in/euwesleyalves" },
      { kv: ["github",   "github.com/euwesleyalves"], href: "https://github.com/euwesleyalves" }
    ],
    langSet: "Idioma alterado para Português.",
    notFound: (c) => "comando não encontrado: " + c + " — digite `help`."
  }
};

const e = React.createElement;

class Component extends DCLogic {
  state = { lines: [], input: "", ready: false, lang: "en", partial: "", typing: false, history: [], histIdx: -1 };
  inputRef = React.createRef();
  scrollRef = React.createRef();

  componentDidMount() {
    const nav = (navigator.language || "en").toLowerCase();
    const pref = this.props.defaultLang || "auto";
    const lang = pref === "auto" ? (nav.startsWith("pt") ? "pt" : "en") : pref;
    this.setState({ lang }, () => this.boot());
  }

  componentDidUpdate(_, prev) {
    const el = this.scrollRef.current;
    if (el) el.scrollTop = el.scrollHeight;
    if (this.state.ready && !prev.ready) this.focusInput();
  }

  boot() {
    const seq = ["welcome", "help"];
    let i = 0;
    const next = () => {
      if (i >= seq.length) { this.setState({ ready: true }); return; }
      this.typeCmd(seq[i], () => {
        this.commit(seq[i]);
        i++;
        setTimeout(next, 260);
      });
    };
    setTimeout(next, 400);
  }

  typeCmd(cmd, done) {
    this.setState({ typing: true, partial: "" });
    let j = 0;
    const tick = () => {
      j++;
      this.setState({ partial: cmd.slice(0, j) });
      if (j < cmd.length) setTimeout(tick, 55 + Math.random() * 45);
      else setTimeout(() => { this.setState({ typing: false }); done(); }, 240);
    };
    setTimeout(tick, 120);
  }

  commit(cmd) {
    const out = this.build(cmd, this.state.lang);
    this.setState(s => ({ lines: [...s.lines, this.promptNode(cmd), ...out] }));
  }

  focusInput = () => { if (this.inputRef.current) this.inputRef.current.focus(); };
  onInput = (ev) => this.setState({ input: ev.target.value });

  onKeyDown = (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); this.run(this.state.input); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); this.recall(-1); }
    else if (ev.key === "ArrowDown") { ev.preventDefault(); this.recall(1); }
    else if (ev.key === "Tab") { ev.preventDefault(); this.complete(); }
  };

  complete() {
    const v = this.state.input.trim().toLowerCase();
    if (!v) return;
    const m = CMDS.find(c => c.startsWith(v));
    if (m) this.setState({ input: m });
  }

  recall(dir) {
    const h = this.state.history;
    if (!h.length) return;
    let idx = this.state.histIdx === -1 ? h.length : this.state.histIdx;
    idx += dir;
    if (idx < 0) idx = 0;
    if (idx >= h.length) { this.setState({ histIdx: -1, input: "" }); return; }
    this.setState({ histIdx: idx, input: h[idx] });
  }

  run(raw) {
    const cmd = raw.trim().toLowerCase();
    const history = raw.trim() ? [...this.state.history, raw.trim()] : this.state.history;
    if (cmd === "clear") {
      const lang = this.state.lang;
      const reset = [
        this.promptNode("welcome"), ...this.build("welcome", lang),
        this.promptNode("help"), ...this.build("help", lang)
      ];
      this.setState({ lines: reset, input: "", history, histIdx: -1 });
      return;
    }
    let lang = this.state.lang;
    let extra = [];
    if (cmd === "en" || cmd === "pt") {
      lang = cmd;
      extra = [this.pNode(T[lang].langSet, "dim"), this.spNode(1), ...this.build("about", lang)];
    }
    const out = (cmd === "en" || cmd === "pt") ? extra : this.build(cmd, lang);
    this.setState(s => ({
      lines: [...s.lines, this.promptNode(raw.trim()), ...out],
      input: "", history, histIdx: -1, lang
    }));
  }

  promptNode(cmd) {
    return e("div", { style: { display: "flex", flexWrap: "wrap", marginTop: "6px" } },
      e("span", { style: { color: "var(--g)", whiteSpace: "pre" } }, "visitor"),
      e("span", { style: { color: "var(--g-dim)", whiteSpace: "pre" } }, "@wesley"),
      e("span", { style: { color: "var(--g-dim)", whiteSpace: "pre" } }, ":~$ "),
      e("span", { style: { color: "var(--g-bright)" } }, cmd)
    );
  }

  hNode(t) { return e("div", { style: { color: "var(--g-bright)", fontWeight: 700, fontSize: "1.1em" } }, t); }
  h2Node(t) { return e("div", { style: { color: "var(--g)", fontWeight: 500, marginTop: "2px" } }, t); }
  pNode(t, tone) { return e("div", { style: { color: tone === "dim" ? "var(--g-dim)" : "var(--g)" } }, t); }
  spNode(n) { return e("div", { style: { height: (n * 0.7) + "em" } }); }

  kvNode(k, v, href) {
    const val = href
      ? e("a", { href, target: "_blank", rel: "noopener", style: { color: "var(--g-bright)" } }, v)
      : e("span", { style: { color: "var(--g-bright)" } }, v);
    return e("div", { style: { display: "flex", gap: "1.2em", flexWrap: "wrap" } },
      e("span", { style: { color: "var(--g-dim)", minWidth: "9.5em", flexShrink: 0 } }, k),
      val
    );
  }

  build(cmd, lang) {
    const t = T[lang];
    if (cmd === "") return [];
    if (cmd === "help") {
      const rows = t.help.map(([c, d]) =>
        e("div", { style: { display: "flex", gap: "1.2em" } },
          e("span", { style: { color: "var(--g-bright)", minWidth: "9em", flexShrink: 0 } }, c),
          e("span", { style: { color: "var(--g-dim)" } }, d)
        ));
      return [e("div", { style: { display: "flex", flexDirection: "column", gap: "1px" } }, ...rows)];
    }
    if (cmd === "welcome") {
      return [
        e("pre", { style: { color: "var(--g-dim)", margin: "8px 0 0", fontSize: "clamp(6px,1.15vw,12px)", lineHeight: 1.1, textShadow: "var(--glow)" } }, BANNER),
        e("div", { style: { color: "var(--g)", marginTop: "10px" } }, t.welcomeSub),
        e("div", { style: { color: "var(--g-dim)", margin: "2px 0" } }, "————"),
        this.pNode(t.welcomeHint, "dim")
      ];
    }
    const data = t[cmd];
    if (!data) return [this.pNode(t.notFound(cmd), "dim")];
    return data.map(item => {
      if (item.h) return this.hNode(item.h);
      if (item.h2) return this.h2Node(item.h2);
      if (item.p) return this.pNode(item.p);
      if (item.d) return e("div", { style: { color: "var(--g-dim)", paddingLeft: "1.2em" } }, item.d);
      if (item.sp) return this.spNode(item.sp);
      if (item.link) return e("div", null, e("a", { href: item.link[1], target: "_blank", rel: "noopener", style: { color: "var(--g-bright)" } }, "→ " + item.link[0]));
      if (item.kv) return this.kvNode(item.kv[0], item.kv[1], item.href);
      return null;
    });
  }

  renderVals() {
    const tone = TONES[this.props.greenTone || "soft"] || TONES.soft;
    const glow = (this.props.glow ?? true) ? "0 0 3px " + tone.dim : "none";
    const rootStyle = {
      "--g": tone.g, "--g-dim": tone.dim, "--g-bright": tone.bright, "--glow": glow,
      height: "100vh", background: "#0d1015", color: "var(--g)",
      textShadow: glow, cursor: "text", position: "relative"
    };

    const kids = this.state.lines.map((n, i) => React.cloneElement(n, { key: "l" + i }));
    if (this.state.typing) {
      kids.push(e("div", { key: "typing", style: { display: "flex", flexWrap: "wrap", marginTop: "6px" } },
        e("span", { style: { color: "var(--g)", whiteSpace: "pre" } }, "visitor"),
        e("span", { style: { color: "var(--g-dim)", whiteSpace: "pre" } }, "@wesley"),
        e("span", { style: { color: "var(--g-dim)", whiteSpace: "pre" } }, ":~$ "),
        e("span", { style: { color: "var(--g-bright)" } }, this.state.partial),
        e("span", { style: { color: "var(--g-bright)", animation: "blink 1s step-end infinite" } }, "▊")
      ));
    }
    const output = e(React.Fragment, null, ...kids);

    return {
      output, rootStyle,
      ready: this.state.ready,
      input: this.state.input,
      scanlines: this.props.scanlines ?? true,
      inputRef: this.inputRef,
      scrollRef: this.scrollRef,
      onInput: this.onInput,
      onKeyDown: this.onKeyDown,
      focusInput: this.focusInput
    };
  }
}
</script>
</body>
</html>
